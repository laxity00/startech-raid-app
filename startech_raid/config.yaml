name: StarTech RAID Monitor
version: "0.3.5"
slug: startech_raid
description: Read-only RAID and SSD monitoring with status pages and a companion HA integration
arch: [aarch64]
startup: application
boot: manual
stage: experimental
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:harddisk
panel_title: StarTech RAID
panel_admin: true
full_access: true
privileged:
  - SYS_RAWIO
apparmor: true
options:
  interval_seconds: 300
  enable_smart: true
  temperature_warning_c: 65
  log_level: info
schema:
  interval_seconds: int(60,3600)
  enable_smart: bool
  temperature_warning_c: int(20,100)
  log_level: list(info|debug|warning)
url: https://github.com/laxity00/startech-raid-app
